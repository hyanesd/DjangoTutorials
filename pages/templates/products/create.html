{% extends 'pages/base.html' %}

{% block title %} {{ title }} {% endblock %}

{% block content %}
<div class="container">

  <h2 class="mb-4">{{ subtitle }}</h2>

  {% if form.errors %}
  <div class="alert alert-danger">
    <ul class="mb-0">
      {% for field in form %}
        {% for error in field.errors %}
          <li>{{ error }}</li>
        {% endfor %}
      {% endfor %}
    </ul>
  </div>
  {% endif %}

  <form method="POST">
    {% csrf_token %}

    <div class="mb-3">
      <label class="form-label">Name</label>
      <input
        type="text"
        name="name"
        class="form-control"
        value="{{ form.data.name }}"
        required
      >
    </div>

    <div class="mb-3">
      <label class="form-label">Price</label>
      <input
        type="number"
        step="0.01"
        name="price"
        class="form-control"
        value="{{ form.data.price }}"
        required
      >
    </div>

    <button type="submit" class="btn btn-primary">
      Save
    </button>
  </form>

</div>
{% endblock %}
